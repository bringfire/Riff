[project]
name = "chirp"
version = "0.1.0"
description = "Adapter service for intelligent Grasshopper components — format, LLM call, parse, validate, cache, trace"
requires-python = ">=3.10"
dependencies = [
    "dspy>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
